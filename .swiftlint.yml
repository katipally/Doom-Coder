# SwiftLint config for Doom Coder.
#
# Goal: catch real mistakes and keep the style consistent without nuking the
# build over cosmetics. The CI lint job runs `swiftlint lint` (not --strict),
# so warnings show up as PR annotations but only error-level rules block a
# merge. If you think a rule is wrong for this codebase, open a PR that changes
# this file with a one-line reason. Do not sprinkle `// swiftlint:disable`
# everywhere instead.

included:
  - DoomCode
  - dc-hook
  - Packages
  - DoomCodeCompanion/DoomCodeCompanion
  - DoomCodeCompanion/NotificationService
  - DoomCodeCompanion/SharedCache

excluded:
  - .build
  - DerivedData
  - "**/.build"
  - "**/build"
  - "**/*.generated.swift"

# Rules that are off by default but worth having on.
opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unused_import
  - redundant_nil_coalescing

# Rules we deliberately turn off (too noisy for an app codebase this size).
disabled_rules:
  - todo                 # TODO/FIXME notes are fine, we track them in issues
  - trailing_whitespace  # the build's warnings-as-errors already keeps this clean
  - nesting              # SwiftUI view bodies nest deeply on purpose

# Keep force-unwrap style rules as warnings, not errors, so a single force
# unwrap in old code cannot block an unrelated PR. Prefer safe unwrapping in
# new code anyway.
force_cast: warning
force_try: warning
force_unwrapping: warning

line_length:
  warning: 140
  error: 250
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 600
  error: 1200

file_length:
  warning: 1200
  error: 2500
  ignore_comment_only_lines: true

function_body_length:
  warning: 120
  error: 300

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 25
  error: 40

# SwiftUI and short scoped names are fine. Don't flag `id`, `x`, `to`, etc.
identifier_name:
  min_length: 1
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]

type_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80

reporter: "xcode"

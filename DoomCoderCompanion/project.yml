# XcodeGen spec for DoomCoder Companion (iOS) + NotificationService extension.
# Generate the project with:
#   cd DoomCoderCompanion && xcodegen generate
name: DoomCoderCompanion
options:
  bundleIdPrefix: com.doomcoder.app
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: A9P2388PHM
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.5.3"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -ObjC"

packages:
  DoomCoderCore:
    path: ../Packages/DoomCoderCore

targets:
  DoomCoderCompanion:
    type: application
    platform: iOS
    sources:
      - path: DoomCoderCompanion
        excludes:
          - "Resources/Info.plist"
          - "Resources/DoomCoderCompanion.entitlements"
          - "Resources/DoomCoderCompanion.Release.entitlements"
      - path: SharedCache
    resources:
      - DoomCoderCompanion/Resources/Assets.xcassets
    info:
      path: DoomCoderCompanion/Resources/Info.plist
      properties:
        CFBundleName: DoomCoder Companion
        CFBundleDisplayName: DoomCoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.doomcoder.app.companion
            CFBundleURLSchemes:
              - doomcoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion
        CODE_SIGN_ENTITLEMENTS: DoomCoderCompanion/Resources/DoomCoderCompanion.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: DoomCoderCompanion/Resources/DoomCoderCompanion.Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "DoomCoder Companion AppStore"
    dependencies:
      - package: DoomCoderCore
      - target: NotificationService
        embed: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "Info.plist"
          - "NotificationService.entitlements"
      - path: SharedCache
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion.NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "DoomCoder Companion NS AppStore"
    dependencies:
      - package: DoomCoderCore

schemes:
  DoomCoderCompanion:
    build:
      targets:
        DoomCoderCompanion: all
        NotificationService: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

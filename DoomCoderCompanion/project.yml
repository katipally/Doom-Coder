# XcodeGen spec for DoomCoder Companion (iOS) + NotificationService extension.
#
# Generate the project with:
#   brew install xcodegen
#   cd DoomCoderCompanion && xcodegen generate
#
# The generated DoomCoderCompanion.xcodeproj is then opened from the
# top-level DoomCoder.xcworkspace (which references both .xcodeproj files
# plus the DoomCoderCore SPM package).

name: DoomCoderCompanion
options:
  bundleIdPrefix: com.doomcoder.app
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: A9P2388PHM
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -ObjC"

packages:
  DoomCoderCore:
    path: ../Packages/DoomCoderCore

targets:
  DoomCoderCompanion:
    type: application
    platform: iOS
    sources:
      - path: DoomCoderCompanion
        excludes:
          - "Resources/Info.plist"
          - "Resources/DoomCoderCompanion.entitlements"
    resources:
      - DoomCoderCompanion/Resources/Assets.xcassets
    info:
      path: DoomCoderCompanion/Resources/Info.plist
      properties:
        CFBundleName: DoomCoder Companion
        CFBundleDisplayName: DoomCoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
          - processing
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - com.doomcoder.app.companion.refresh
        NSLocalNetworkUsageDescription: "DoomCoder Companion sends a Wake-on-LAN packet on your local Wi-Fi to wake your Mac. Network access is used only when you tap Wake."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion
        CODE_SIGN_ENTITLEMENTS: DoomCoderCompanion/Resources/DoomCoderCompanion.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: DoomCoderCore
      - target: NotificationService
        embed: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "Info.plist"
          - "NotificationService.entitlements"
      - path: DoomCoderCompanion/SharedCache
        group: SharedCache
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion.NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
    dependencies:
      - package: DoomCoderCore

schemes:
  DoomCoderCompanion:
    build:
      targets:
        DoomCoderCompanion: all
        NotificationService: all
    run:
      config: Debug
      commandLineArguments: {}
      environmentVariables: []
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  NotificationService:
    build:
      targets:
        NotificationService: all
    run:
      config: Debug
    archive:
      config: Release

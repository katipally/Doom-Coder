# XcodeGen spec for DoomCode Companion (iOS) + NotificationService extension.
# Generate the project with:
#   cd DoomCodeCompanion && xcodegen generate
name: DoomCodeCompanion
options:
  bundleIdPrefix: com.doomcoder.app
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: A9P2388PHM
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "2.7.0"
    CURRENT_PROJECT_VERSION: "12"
    # Audit 2026-06: the iOS project has no shell-script build phases
    # (the dc-hook swiftc phase lives in the Mac project), so
    # sandboxing the build scripts does not break anything. Re-enable
    # the Xcode 15+ default. The Mac project's project.pbxproj still
    # has this set to NO because of the dc-hook phase.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -ObjC"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  DoomCodeCore:
    path: ../Packages/DoomCodeCore

targets:
  DoomCodeCompanion:
    type: application
    platform: iOS
    sources:
      - path: DoomCodeCompanion
        excludes:
          - "Resources/Info.plist"
          - "Resources/DoomCodeCompanion.entitlements"
          - "Resources/DoomCodeCompanion.Release.entitlements"
      - path: SharedCache
    resources:
      - DoomCodeCompanion/Resources/Assets.xcassets
    info:
      path: DoomCodeCompanion/Resources/Info.plist
      properties:
        CFBundleName: Doom Code Companion
        CFBundleDisplayName: Doom Code Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Doom Code uses the camera to scan the QR code shown on your Mac so you can connect your devices.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
          - fetch          # required for BGAppRefreshTask (background data sync)
          - processing     # allows a longer BGProcessingTask window if added later
        BGTaskSchedulerPermittedIdentifiers:
          - com.doomcoder.app.companion.refresh
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Audit 2026-06: explicit category for App Store browse placement.
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: com.doomcoder.app.companion
            CFBundleURLSchemes:
              - doomcoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion
        CODE_SIGN_ENTITLEMENTS: DoomCodeCompanion/Resources/DoomCodeCompanion.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: DoomCodeCompanion/Resources/DoomCodeCompanion.Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: "DoomCoder Companion AppStore"
    dependencies:
      - package: DoomCodeCore
      - target: NotificationService
        embed: true
      - sdk: FoundationModels.framework
        weak: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "Info.plist"
          - "NotificationService.entitlements"
      - path: SharedCache
    resources:
      - path: NotificationService/Resources/agent-icons
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doomcoder.app.companion.NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "DoomCoder Companion NS AppStore"
    dependencies:
      - package: DoomCodeCore

schemes:
  DoomCodeCompanion:
    build:
      targets:
        DoomCodeCompanion: all
        NotificationService: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Compute monotonic build number: major*1000 + minor*100 + patch
          # e.g. 1.9.0 → 1900, 1.9.1 → 1901, 1.10.0 → 2000
          # (tr -d '.' would give 190 for 1.9.0 < 1810 for 1.8.10 — wrong)
          IFS='.' read -r _MAJOR _MINOR _PATCH <<< "$VERSION"
          BUILD=$(( _MAJOR * 1000 + _MINOR * 100 + _PATCH ))
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_ENV
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Select Xcode
        run: |
          # Pick Xcode.app symlink if present, otherwise latest versioned Xcode
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "Using Xcode at: ${XCODE_PATH}"
            sudo xcode-select -s "${XCODE_PATH}"
          fi
          xcodebuild -version

      - name: Update version in project
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.VERSION }}" DoomCoder/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.BUILD }}" DoomCoder/Info.plist

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode the base64-encoded .p12 certificate
          echo "${APPLE_CERTIFICATE}" | base64 --decode -o certificate.p12

          # Create a temporary CI keychain
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import the certificate — T flags allow codesign to access without prompts
          security import certificate.p12 \
            -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD}" build.keychain

          # Add build.keychain to the search list so Xcode can find the cert
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          # Verify certificate is imported
          security find-identity -v -p codesigning build.keychain

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoder

      - name: Build Release Archive
        run: |
          xcodebuild \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoder \
            -configuration Release \
            -archivePath build/DoomCoder.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="${{ env.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ env.BUILD }}"

      - name: Export Archive (Developer ID)
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/DoomCoder.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist scripts/ExportOptions.plist

      - name: Re-sign embedded frameworks
        run: |
          APP="build/export/DoomCoder.app"
          IDENTITY="Developer ID Application"

          # Sign every Mach-O binary inside the bundle BEFORE signing the bundle itself.
          # Order: deepest paths first (XPC services, nested .apps, frameworks, dylibs,
          # then plain binaries like dc-hook and Sparkle's Autoupdate helper).
          #
          # Why: notarization scans every binary in the bundle — any binary signed with
          # the wrong identity (e.g. Sparkle's own cert) causes Apple to stall or fail.

          echo "=== Signing all Mach-O binaries (deepest first) ==="
          # Sort by path depth (most slashes = deepest = sign first) using tab-delimited cut
          find "$APP" -type f | \
            awk '{ printf "%d\t%s\n", gsub("/","/"), $0 }' | sort -rn | cut -f2- | \
            while IFS= read -r f; do
              if file "$f" 2>/dev/null | grep -qE "Mach-O|shared library"; then
                echo "  Signing: $f"
                codesign --force \
                  --sign "$IDENTITY" \
                  --timestamp \
                  --options runtime \
                  "$f"
              fi
            done

          echo "=== Signing XPC service bundles ==="
          find "$APP" -type d -name "*.xpc" | \
            awk '{ printf "%d\t%s\n", gsub("/","/"), $0 }' | sort -rn | cut -f2- | \
            while IFS= read -r xpc; do
              echo "  Signing: $xpc"
              codesign --force \
                --sign "$IDENTITY" \
                --timestamp \
                --options runtime \
                "$xpc"
            done

          echo "=== Signing nested .app bundles ==="
          find "$APP" -mindepth 2 -type d -name "*.app" | \
            awk '{ printf "%d\t%s\n", gsub("/","/"), $0 }' | sort -rn | cut -f2- | \
            while IFS= read -r nested; do
              echo "  Signing: $nested"
              codesign --force \
                --sign "$IDENTITY" \
                --timestamp \
                --options runtime \
                "$nested"
            done

          echo "=== Signing frameworks ==="
          find "$APP" -type d -name "*.framework" | \
            awk '{ printf "%d\t%s\n", gsub("/","/"), $0 }' | sort -rn | cut -f2- | \
            while IFS= read -r fw; do
              echo "  Signing: $fw"
              codesign --force \
                --sign "$IDENTITY" \
                --timestamp \
                --options runtime \
                "$fw"
            done

          echo "=== Signing main app bundle (with entitlements) ==="
          codesign --force \
            --sign "$IDENTITY" \
            --timestamp \
            --options runtime \
            --entitlements "DoomCoder/DoomCoder.entitlements" \
            "$APP"

          echo "=== Verifying ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ All binaries signed and verified"

      - name: Notarize app
        env:
          NOTARIZE_KEY_P8: ${{ secrets.NOTARIZE_KEY_P8 }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
          NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
        run: |
          echo "${NOTARIZE_KEY_P8}" | base64 --decode > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

          # Zip the app for submission (notarytool requires a zip, not .app directly)
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/DoomCoder.app" \
            "build/DoomCoder-notarize.zip"

          # Submit without --wait so we get an ID immediately and can monitor
          echo "Submitting to Apple notarization..."
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "build/DoomCoder-notarize.zip" \
            --key /tmp/AuthKey.p8 \
            --key-id "${NOTARIZE_KEY_ID}" \
            --issuer "${NOTARIZE_ISSUER_ID}" \
            --no-wait \
            --output-format json)
          echo "Submit response: ${SUBMISSION_OUTPUT}"

          SUBMISSION_ID=$(echo "${SUBMISSION_OUTPUT}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['id'])")
          echo "Submission ID: ${SUBMISSION_ID}"

          # Wait for Apple to finish — typically 2-10 min, up to 30 on a bad day.
          # We use || to prevent set -e from killing us before we can print the log.
          NOTARIZE_OK=0
          xcrun notarytool wait "${SUBMISSION_ID}" \
            --key /tmp/AuthKey.p8 \
            --key-id "${NOTARIZE_KEY_ID}" \
            --issuer "${NOTARIZE_ISSUER_ID}" \
            --timeout 60m || NOTARIZE_OK=1

          # Always print the full Apple notarization log (essential for debugging)
          echo "=== Apple Notarization Log ==="
          xcrun notarytool log "${SUBMISSION_ID}" \
            --key /tmp/AuthKey.p8 \
            --key-id "${NOTARIZE_KEY_ID}" \
            --issuer "${NOTARIZE_ISSUER_ID}" || true

          rm -f /tmp/AuthKey.p8

          [ "${NOTARIZE_OK}" -eq 0 ] || { echo "::error::Notarization failed — see log above"; exit 1; }

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "build/export/DoomCoder.app"
          xcrun stapler validate "build/export/DoomCoder.app"

      - name: Create DMG
        run: |
          brew install create-dmg 2>/dev/null || true

          create-dmg \
            --volname "DoomCoder" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "DoomCoder.app" 175 190 \
            --hide-extension "DoomCoder.app" \
            --app-drop-link 425 185 \
            "DoomCoder-${{ env.VERSION }}.dmg" \
            "build/export/"

          # Sign the DMG with Developer ID — the .app inside is already notarized+stapled,
          # so macOS will trust it. The DMG itself just needs a Developer ID signature.
          codesign \
            --sign "Developer ID Application" \
            --timestamp \
            "DoomCoder-${{ env.VERSION }}.dmg"

      - name: Create distribution ZIP
        run: |
          # Use ditto (Apple-recommended) to produce the final signed + stapled ZIP
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/DoomCoder.app" \
            "DoomCoder-${{ env.VERSION }}.zip"
          echo "ZIP_SIZE=$(stat -f%z 'DoomCoder-${{ env.VERSION }}.zip')" >> $GITHUB_ENV

      - name: Download Sparkle tools
        run: |
          SPARKLE_VER="2.9.1"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            -o sparkle.tar.xz
          mkdir sparkle-tools
          tar xf sparkle.tar.xz -C sparkle-tools
          chmod +x sparkle-tools/bin/*

      - name: Sign ZIP with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Pipe key via stdin — correct Sparkle 2.x API (env var not supported)
          # -p flag outputs ONLY the base64 signature, no parsing needed
          SPARKLE_SIG=$(echo "${SPARKLE_PRIVATE_KEY}" | \
            sparkle-tools/bin/sign_update --ed-key-file - -p "DoomCoder-${{ env.VERSION }}.zip")

          echo "Signature: $SPARKLE_SIG"
          echo "Zip size:  ${{ env.ZIP_SIZE }}"
          echo "SPARKLE_SIG=${SPARKLE_SIG}" >> $GITHUB_ENV

      - name: Update appcast.xml
        run: |
          python3 scripts/update_appcast.py \
            --version "${{ env.VERSION }}" \
            --build "${{ env.BUILD }}" \
            --signature "${{ env.SPARKLE_SIG }}" \
            --size "${{ env.ZIP_SIZE }}" \
            --download-url "https://github.com/katipally/Doom-Coder/releases/download/${{ env.TAG }}/DoomCoder-${{ env.VERSION }}.zip"

      - name: Commit updated appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry up to 5 times in case main moves between fetch and push.
          # Strategy: stash our generated changes, rebase onto latest main,
          # re-apply, then push. Non-fast-forward pushes are retried with
          # a fresh appcast regeneration in case main already advanced.
          for attempt in 1 2 3 4 5; do
            echo "--- Commit attempt ${attempt} ---"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: update appcast.xml for ${{ env.TAG }}"
            else
              echo "No changes to commit on attempt ${attempt}"
            fi

            git fetch origin main

            # Prefer our generated appcast.xml & Info.plist bumps on conflict —
            # they are deterministic from the tag and always correct.
            if ! git pull --rebase -X theirs origin main; then
              echo "Rebase failed, aborting and retrying with regenerated appcast"
              git rebase --abort || true
              git reset --hard "origin/main"
              # Re-apply the generated appcast entry on top of fresh main
              python3 scripts/update_appcast.py \
                --version "${{ env.VERSION }}" \
                --build "${{ env.BUILD }}" \
                --signature "${{ env.SPARKLE_SIG }}" \
                --size "${{ env.ZIP_SIZE }}" \
                --download-url "https://github.com/katipally/Doom-Coder/releases/download/${{ env.TAG }}/DoomCoder-${{ env.VERSION }}.zip"
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi

            echo "Push rejected, sleeping before retry"
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push appcast.xml update after 5 attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: "Doom Coder ${{ env.TAG }}"
          files: |
            DoomCoder-${{ env.VERSION }}.dmg
            DoomCoder-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            ## 📦 Installation

            **Option A — DMG (recommended for new installs):**
            1. Download **`DoomCoder-${{ env.VERSION }}.dmg`** below
            2. Open it and drag **DoomCoder** into your Applications folder
            3. Double-click to launch — no extra steps

            **Option B — ZIP:**
            1. Download **`DoomCoder-${{ env.VERSION }}.zip`** below
            2. Unzip and move **`DoomCoder.app`** to `/Applications`
            3. Double-click to launch

            DoomCoder is **signed with a Developer ID and notarized by Apple**. macOS trusts it out of the box — no Gatekeeper warnings.

            > Existing users receive updates automatically via the built-in updater (Sparkle).

            ## ✅ Verify it's working

            After enabling DoomCoder, run this in Terminal:
            ```bash
            pmset -g assertions | grep DoomCoder
            ```
            You should see: `PreventUserIdleDisplaySleep named: "DoomCoder: Preventing sleep for AI coding session"`

            ---
            Full changelog: [CHANGELOG.md](https://github.com/katipally/Doom-Coder/blob/main/CHANGELOG.md)

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12


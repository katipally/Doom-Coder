name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  mac-release:
    name: macOS Build, Sign, Notarize & Release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r _MAJOR _MINOR _PATCH <<< "$VERSION"
          BUILD=$(( _MAJOR * 1000 + _MINOR * 100 + _PATCH ))
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_ENV
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/mac_cert.p12"

          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | awk -F'"' '{print $2}' | head -1)
          echo "SIGNING_IDENTITY=${SIGNING_IDENTITY}" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Update version in project
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.VERSION }}" DoomCoder/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.BUILD }}" DoomCoder/Info.plist

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoder

      - name: Build Release Archive
        run: |
          xcodebuild \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoder \
            -configuration Release \
            -archivePath build/DoomCoder.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="${{ env.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ env.BUILD }}"

      - name: Sign app with Developer ID (bottom-up)
        run: |
          cp -R "build/DoomCoder.xcarchive/Products/Applications/DoomCoder.app" .

          xattr -cr DoomCoder.app

          APP="DoomCoder.app"
          SPARKLE_FW="$APP/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VER="$SPARKLE_FW/Versions/B"
          ID="${{ env.SIGNING_IDENTITY }}"

          # 1. Sign Sparkle XPC Services (deepest nested first)
          for xpc in "$SPARKLE_VER/XPCServices/Installer.xpc" \
                     "$SPARKLE_VER/XPCServices/Downloader.xpc"; do
            if [ -d "$xpc" ]; then
              echo "Signing: $xpc"
              codesign --force --options runtime --timestamp --sign "$ID" "$xpc"
            fi
          done

          # 2. Sign Sparkle helper apps and tools
          if [ -d "$SPARKLE_VER/Updater.app" ]; then
            echo "Signing: Updater.app"
            codesign --force --options runtime --timestamp --sign "$ID" "$SPARKLE_VER/Updater.app"
          fi
          if [ -f "$SPARKLE_VER/Autoupdate" ]; then
            echo "Signing: Autoupdate"
            codesign --force --options runtime --timestamp --sign "$ID" "$SPARKLE_VER/Autoupdate"
          fi

          # 3. Sign the Sparkle framework (after all its children)
          echo "Signing: Sparkle.framework"
          codesign --force --options runtime --timestamp --sign "$ID" "$SPARKLE_FW"

          # 4. Sign dc-hook helper binary if present
          if [ -f "$APP/Contents/Resources/dc-hook" ]; then
            echo "Signing: dc-hook"
            codesign --force --options runtime --timestamp --sign "$ID" \
              "$APP/Contents/Resources/dc-hook"
          fi

          # 5. Sign the main app bundle last (seals everything)
          echo "Signing: DoomCoder.app"
          codesign --force --options runtime --timestamp --sign "$ID" \
            --entitlements DoomCoder/DoomCoder.entitlements "$APP"

          echo ""
          echo "=== Verifying signatures ==="
          codesign --verify --strict --verbose=2 "$APP" 2>&1
          echo ""
          codesign -dvv "$APP" 2>&1

      - name: Notarize app
        run: |
          ditto -c -k --keepParent DoomCoder.app notarize_input.zip

          xcrun notarytool submit notarize_input.zip \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            --key-id "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --wait \
            --output-format plist \
            > notarize_result.plist || {
              echo "::error::Notarization submission failed"
              cat notarize_result.plist || true
              exit 1
            }

          NOTARY_STATUS=$(plutil -extract status raw notarize_result.plist)
          echo "Notarization status: ${NOTARY_STATUS}"
          if [ "${NOTARY_STATUS}" != "Accepted" ]; then
            echo "::error::Notarization rejected — see log for details"
            cat notarize_result.plist
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple DoomCoder.app
          xcrun stapler validate DoomCoder.app
          echo "✅ Notarization ticket stapled successfully"

      - name: Create final release ZIP
        run: |
          ditto -c -k --keepParent "DoomCoder.app" "DoomCoder-${{ env.VERSION }}.zip"

      - name: Download Sparkle tools
        run: |
          SPARKLE_VER="2.9.1"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            -o sparkle.tar.xz
          mkdir sparkle-tools
          tar xf sparkle.tar.xz -C sparkle-tools
          chmod +x sparkle-tools/bin/*

      - name: Sign ZIP with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_SIG=$(echo "${SPARKLE_PRIVATE_KEY}" | \
            sparkle-tools/bin/sign_update --ed-key-file - -p "DoomCoder-${{ env.VERSION }}.zip")
          ZIP_SIZE=$(stat -f%z "DoomCoder-${{ env.VERSION }}.zip")

          echo "Signature: $SPARKLE_SIG"
          echo "Zip size:  $ZIP_SIZE"
          echo "SPARKLE_SIG=${SPARKLE_SIG}" >> $GITHUB_ENV
          echo "ZIP_SIZE=${ZIP_SIZE}" >> $GITHUB_ENV

      - name: Update appcast.xml
        run: |
          python3 scripts/update_appcast.py \
            --version "${{ env.VERSION }}" \
            --build "${{ env.BUILD }}" \
            --signature "${{ env.SPARKLE_SIG }}" \
            --size "${{ env.ZIP_SIZE }}" \
            --download-url "https://github.com/katipally/Doom-Coder/releases/download/${{ env.TAG }}/DoomCoder-${{ env.VERSION }}.zip"

      - name: Commit updated appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "--- Commit attempt ${attempt} ---"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: update appcast.xml for ${{ env.TAG }}"
            else
              echo "No changes to commit on attempt ${attempt}"
            fi

            git fetch origin main

            if ! git pull --rebase -X theirs origin main; then
              echo "Rebase failed, aborting and retrying"
              git rebase --abort || true
              git reset --hard "origin/main"
              python3 scripts/update_appcast.py \
                --version "${{ env.VERSION }}" \
                --build "${{ env.BUILD }}" \
                --signature "${{ env.SPARKLE_SIG }}" \
                --size "${{ env.ZIP_SIZE }}" \
                --download-url "https://github.com/katipally/Doom-Coder/releases/download/${{ env.TAG }}/DoomCoder-${{ env.VERSION }}.zip"
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "::error::Failed to push appcast.xml update after 5 attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: "Doom Coder ${{ env.TAG }}"
          files: DoomCoder-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            ## 📦 Installation

            1. Download **`DoomCoder-${{ env.VERSION }}.zip`** below
            2. Unzip and drag **`DoomCoder.app`** to your `/Applications` folder
            3. Double-click to open — the app is **signed and notarized by Apple**, so it opens without any Gatekeeper warning

            ### iOS companion app

            Install **Doom Coder** from the App Store on your iPhone or iPad to track your coding agents with Live Activities, Dynamic Island, and rich notifications.

            ---
            Full changelog: [CHANGELOG.md](https://github.com/katipally/Doom-Coder/blob/main/CHANGELOG.md)

  ios-testflight:
    name: iOS TestFlight Upload
    runs-on: macos-26
    needs: mac-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r _MAJOR _MINOR _PATCH <<< "$VERSION"
          BUILD=$(( _MAJOR * 1000 + _MINOR * 100 + _PATCH ))
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_ENV

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios_build.keychain"
          CERT_PATH="$RUNNER_TEMP/ios_cert.p12"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_APP_PROFILE_BASE64" | base64 --decode > /tmp/ios_app.mobileprovision
          echo "$IOS_WIDGET_PROFILE_BASE64" | base64 --decode > /tmp/ios_widget.mobileprovision

          APP_UUID=$(security cms -D -i /tmp/ios_app.mobileprovision \
            | plutil -extract UUID raw -)
          WIDGET_UUID=$(security cms -D -i /tmp/ios_widget.mobileprovision \
            | plutil -extract UUID raw -)
          APP_PROFILE_NAME=$(security cms -D -i /tmp/ios_app.mobileprovision \
            | plutil -extract Name raw -)
          WIDGET_PROFILE_NAME=$(security cms -D -i /tmp/ios_widget.mobileprovision \
            | plutil -extract Name raw -)

          cp /tmp/ios_app.mobileprovision "$PROFILE_DIR/${APP_UUID}.mobileprovision"
          cp /tmp/ios_widget.mobileprovision "$PROFILE_DIR/${WIDGET_UUID}.mobileprovision"

          echo "APP_PROFILE_NAME=${APP_PROFILE_NAME}" >> $GITHUB_ENV
          echo "WIDGET_PROFILE_NAME=${WIDGET_PROFILE_NAME}" >> $GITHUB_ENV

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoderiOS

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project DoomCoder.xcodeproj \
            -scheme DoomCoderiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DoomCoderiOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            DEVELOPMENT_TEAM=A9P2388PHM \
            MARKETING_VERSION="${{ env.VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ env.BUILD }}"

      - name: Create ExportOptions.plist
        run: |
          cat > ios_export_options.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>A9P2388PHM</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.doomcoder.ios</key>
                  <string>${{ env.APP_PROFILE_NAME }}</string>
                  <key>com.doomcoder.ios.widget</key>
                  <string>${{ env.WIDGET_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath build/DoomCoderiOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios_export_options.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/export -name "*.ipa" | head -1)
          echo "Uploading: ${IPA}"
          xcrun altool --upload-app \
            --type ios \
            -f "${IPA}" \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

name: Labeler

# Tags pull requests with area labels (docs, ci, mac, ios, core) based on the
# files they change. Rules live in .github/labeler.yml.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6

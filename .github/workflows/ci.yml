name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Debug)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DoomCode.xcodeproj \
            -scheme DoomCode

      - name: Build
        run: |
          xcodebuild \
            -project DoomCode.xcodeproj \
            -scheme DoomCode \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build
